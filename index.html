function taste(picks) {
  const n = {};
  for (const s of picks) n[s.genre] = (n[s.genre] || 0) + 1;
  const max = Math.max(...Object.values(n));
  const top = Object.keys(n).filter(g => n[g] === max);
  return top.length >= 3 ? "ALL" : picks.find(s => top.includes(s.genre)).genre;
}

const clock = n => `${Math.floor(n / 60)}:${pad(n % 60)}`;
const cover = s => `asset/cover/${s.no}.webp?v=${V}`;
const INAPP = /Instagram|KAKAOTALK|FBAN|FBAV|NAVER|Line\/|everytimeApp/i.test(navigator.userAgent);
const PHONE = matchMedia("(pointer: coarse)").matches;

const app = document.getElementById("app");
const shelf = [...SONGS].sort(() => Math.random() - .5); // 들어올 때마다 진열 순서 섞기
let picks = [], receipt = null; // receipt: 지금 picks로 만든 영수증 { key, blob, url }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600);
}

function pickPage() {
  return `
  <div class="page">
    <div class="head">
      <img class="cart" src="asset/cart.webp" alt="">
      <p class="kick">GR@B MART · PRE-EVENT</p>
      <h1 class="ik">PICK UP</h1>
      <p class="sub">2026.11.09 RGB 단독공연</p>
      <p class="lead">공연에서 연주할 ${SONGS.length}곡이 진열돼 있어요.<br>제목은 비밀. 표지랑 가사 한 단어만 보고<br>끌리는 곡을 1~${MAX}곡 담아주세요.</p>
    </div>
    <div class="grid" id="shelf">${shelf.map((s, i) => `
      <button class="item" data-no="${s.no}" aria-pressed="false" aria-label="표지 ${i + 1}, 가사 키워드 ${esc(s.kw)}">
        <span class="kw ik t${i % 6}">${esc(s.kw)}</span>
        <div class="pic"><img src="${cover(s)}" alt="" loading="${i < 6 ? "eager" : "lazy"}"></div>
        <span class="badge"></span>
      </button>`).join("")}
    </div>
  </div>
  <div class="bar"><div class="in">
    <p class="count"><small>MY CART</small><span id="n">0</span> / ${MAX}</p>
    <button class="btn" id="go">계산하기 →</button>
  </div></div>`;
}

function syncCart() {
  for (const el of document.querySelectorAll("#shelf .item")) {
    const i = picks.findIndex(s => s.no === +el.dataset.no);
    el.classList.toggle("on", i >= 0);
    el.setAttribute("aria-pressed", i >= 0);
    el.querySelector(".badge").textContent = i >= 0 ? pad(i + 1) : "";
  }
  document.getElementById("shelf").classList.toggle("full", picks.length >= MAX);
  document.getElementById("n").textContent = picks.length;
  document.getElementById("go").disabled = !picks.length;
}

function resultPage() {
  const key = taste(picks), t = TASTE[key];
  const total = picks.reduce((a, s) => a + secs(s.time), 0);
  const ramen = Math.floor(total / 240);
  const rest = SONGS.filter(s => !picks.includes(s));
  const same = rest.filter(s => s.genre === key);
  const reco = (same.length ? same : rest)[Math.floor(Math.random() * (same.length || rest.length))];
  return `
  <div class="page">
    <div class="head">
      <p class="kick">GR@B MART · TASTE REPORT</p>
      <h1 class="ik gname">${t.en}</h1>
    </div>
    <p class="who">당신은<br>${t.who}</p>
    <div class="body">${t.body.map(p => `<p>${p}</p>`).join("")}</div>
    <div class="block">
      <h3>구매 내역</h3>
      <ul class="bought">${picks.map(s => `
        <li><img src="${cover(s)}" alt=""><div><b>${esc(s.title)}</b><span>${esc(s.artist)} · ${esc(s.genre)}</span></div><span class="t">${s.time}</span></li>`).join("")}
      </ul>
      <div class="total"><span>${ramen ? `컵라면 ${ramen}개 끓일 수 있는 시간` : "컵라면 하나도 못 끓이는 시간. 짧고 굵게!"}</span><b class="t">${clock(total)}</b></div>
    </div>
    <div class="block"><h3>자주 가는 코너</h3><p class="txt">${t.aisle}</p></div>
    <div class="block">
      <h3>이 상품도 담아보세요</h3>
      <div class="reco"><img src="${cover(reco)}" alt=""><div><b>${esc(reco.title)}</b><span>${esc(reco.artist)} · 11월 9일에 들을 수 있어요</span></div></div>
    </div>
    <div class="block"><h3>계산원 메모</h3><p class="txt">${MEMO[picks.length]}</p></div>
    <div class="btns">
      <a class="btn" href="#/receipt">영수증 출력하기 →</a>
      <a class="btn ghost" href="#">다시 담으러 가기</a>
    </div>
  </div>`;
}

// 영수증: 위(로고~표 머리) + 담은 곡 수만큼 줄 + 아래(날짜~THANK YOU)
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = `${src}?v=${V}`; });
async function makeReceipt() {
  const key = picks.map(s => s.no).join();
  if (receipt?.key === key) return receipt;
  const [top, bottom, noise, glitch, ...rows] = await Promise.all([
    load("receipt/top.png"), load("receipt/bottom.png"), load("asset/noise.jpeg"), load("asset/glitch.webp"),
    ...picks.map(s => load(`asset/cover/${s.no}.webp`)),
    ...picks.flatMap((s, i) => [load(`receipt/n${i + 1}.png`), load(`receipt/s${s.no}.png`)]),
  ]);
  const covers = rows.splice(0, picks.length);
  const c = document.createElement("canvas");
  c.width = top.width; c.height = top.height + picks.length * ROW + bottom.height;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(top, 0, 0);
  rows.forEach((im, i) => x.drawImage(im, 0, top.height + (i >> 1) * ROW));
  x.drawImage(bottom, 0, top.height + picks.length * ROW);

  // 스토리용 9:16: 담은 표지 콜라주 + 센 노이즈 위 가운데에, 인스타 UI가 덮는 위아래는 비워둠
  const st = document.createElement("canvas");
  st.width = STORY_W; st.height = STORY_H;
  const y = st.getContext("2d");
  // 표지를 기울여 바둑판으로. 이웃한 칸끼리 다른 표지가 오게 (r + c) 순서, 한 장이면 화면 가득
  const span = Math.hypot(STORY_W, STORY_H), size = covers.length > 1 ? span / 4 : span, n = Math.round(span / size);
  y.save(); y.translate(STORY_W / 2, STORY_H / 2); y.rotate(-8 * Math.PI / 180);
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++)
    y.drawImage(covers[(r + col) % covers.length], -span / 2 + col * size, -span / 2 + r * size, size, size);
  y.restore();
  const blend = (op, a, fill) => { y.globalCompositeOperation = op; y.globalAlpha = a; y.fillStyle = fill; y.fillRect(0, 0, STORY_W, STORY_H); };
  blend("multiply", .55, "#272d6e"); // 영수증이 튀게 남색으로 눌러줌
  const tile = y.createPattern(noise, "repeat");
  tile.setTransform(new DOMMatrix().scale(1.4));
  blend("overlay", .9, tile);
  y.globalCompositeOperation = "soft-light"; y.globalAlpha = .5;
  const g = Math.max(STORY_W / glitch.width, STORY_H / glitch.height);
  y.drawImage(glitch, (STORY_W - glitch.width * g) / 2, (STORY_H - glitch.height * g) / 2, glitch.width * g, glitch.height * g);
  y.globalCompositeOperation = "source-over"; y.globalAlpha = 1;
  // 필름 그레인
  const px = y.getImageData(0, 0, STORY_W, STORY_H), d = px.data;
  for (let i = 0; i < d.length; i += 4) { const v = (Math.random() - .5) * GRAIN; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
  y.putImageData(px, 0, 0);
  const k = Math.min((STORY_W - 2 * SAFE_X) / c.width, (STORY_H - 2 * SAFE_Y) / c.height);
  const w = c.width * k, h = c.height * k;
  y.shadowColor = "rgba(0,0,0,.55)"; y.shadowBlur = 50; y.shadowOffsetY = 18;
  y.drawImage(c, (STORY_W - w) / 2, (STORY_H - h) / 2, w, h);

  const png = cv => new Promise(ok => cv.toBlob(ok, "image/png"));
  const [blob, story] = await Promise.all([png(c), png(st)]);
  if (receipt) { URL.revokeObjectURL(receipt.url); URL.revokeObjectURL(receipt.storyUrl); }
  return receipt = { key, url: URL.createObjectURL(blob), story, storyUrl: URL.createObjectURL(story) };
}

function receiptPage() {
  makeReceipt().then(r => {
    const el = document.getElementById("paper");
    // 앱 안 브라우저는 길게 눌러 저장하니까 스토리용 이미지를 보여줌
    if (el) el.innerHTML = `<img src="${INAPP ? r.storyUrl : r.url}" alt="GR@B 영수증: ${picks.map(s => esc(s.title)).join(", ")}">`;
  }).catch(() => toast("영수증을 못 불러왔어요. 새로고침 해주세요"));
  return `
  <div class="page">
    <div class="head">
      <p class="kick">GR@B MART · RECEIPT</p>
      <h1 class="ik">THANK<br>YOU</h1>
    </div>
    <div class="slot"></div>
    <div class="paper" id="paper"><p class="loading">영수증 출력 중…</p></div>
    ${INAPP ? `<p class="hint">앱 안에서 열린 화면이라 바로 공유가 안 될 수 있어요.<br><b>영수증을 길게 눌러 사진에 저장</b>한 다음 인스타 스토리에 올려주세요.</p>` : ""}
    <div class="btns">
      <button class="btn" id="share">인스타 스토리에 공유하기</button>
      <button class="btn ghost" id="save">이미지 저장</button>
      <a class="btn ghost" href="#" id="again">처음부터 다시 담기</a>
    </div>
    ${PHONE && !INAPP ? `<p class="note">이미지 저장을 누르고 공유 창에서 <b>'이미지 저장'</b>을 고르면 사진 앱에 들어가요.</p>` : ""}
  </div>`;
}

// 폰에서 다운로드하면 '파일' 앱으로 가버려서, 저장도 공유 창('이미지 저장' → 사진 앱)으로 보냄
async function out(mode) {
  const r = await makeReceipt();
  const file = new File([r.story], "GRAB-receipt.png", { type: "image/png" });
  if ((mode === "share" || PHONE) && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); }
    catch (e) { if (e.name !== "AbortError") toast("이미지를 길게 눌러 저장해주세요"); }
  } else if (INAPP) toast("이미지를 길게 눌러 저장해주세요");
  else {
    const a = document.createElement("a");
    a.href = r.storyUrl; a.download = "GRAB-receipt.png"; a.click();
    if (mode === "share") toast("저장한 이미지를 스토리에 올려주세요");
  }
}

app.addEventListener("click", e => {
  const item = e.target.closest("#shelf .item");
  if (item) {
    const s = SONGS[item.dataset.no - 1], i = picks.indexOf(s);
    if (i >= 0) picks.splice(i, 1);
    else if (picks.length >= MAX) return toast(`카트가 꽉 찼어요 (최대 ${MAX}곡)`);
    else picks.push(s);
    return syncCart();
  }
  const id = e.target.closest("button, a")?.id;
  if (id === "go") location.hash = "#/result";
  if (id === "share" || id === "save") out(id);
  if (id === "again") picks = [];
});

function route() {
  // 새로고침하면 카트가 비니까 결과 주소에 남아 있으면 진열대로
  if (!picks.length && location.hash) history.replaceState(null, "", location.pathname);
  const page = location.hash;
  document.body.classList.toggle("picking", !/^#\/(result|receipt)$/.test(page));
  app.innerHTML = page === "#/result" ? resultPage() : page === "#/receipt" ? receiptPage() : pickPage();
  if (document.getElementById("shelf")) syncCart();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
